<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prompter - skrypty</title>
<meta name="theme-color" content="#0d0d0d">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="manifest" href="./manifest.webmanifest">
<style>
  :root{
    --bg:#0d0d0d; --panel:#151515; --panel2:#1c1c1c; --line:#282828;
    --txt:#f2f2f2; --dim:#8d8d8d; --accent:#ff3b30; --ok:#34c759;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; -webkit-text-size-adjust:100%; }
  button{ font-family:inherit; font-size:14px; cursor:pointer; }
  input,textarea{ font-family:inherit; }

  /* ---------- szkielet ---------- */
  #wrap{ display:flex; flex-direction:column; height:100dvh; }
  header{ display:flex; align-items:center; gap:12px; padding:12px 18px; border-bottom:1px solid var(--line);
    background:#111; flex:none; flex-wrap:wrap; }
  header .logo{ font-weight:800; letter-spacing:.4px; font-size:16px; }
  header .logo span{ color:var(--accent); }
  header .sp{ flex:1; }
  .chip{ display:inline-flex; align-items:center; gap:7px; background:var(--panel2); border:1px solid var(--line);
    color:var(--dim); border-radius:20px; padding:6px 13px; font-size:12.5px; white-space:nowrap; }
  .chip .dot{ width:8px; height:8px; border-radius:50%; background:#666; flex:none; }
  .chip.on .dot{ background:var(--ok); }
  .chip.err .dot{ background:var(--accent); }
  .btn{ background:var(--panel2); border:1px solid var(--line); color:var(--txt); border-radius:10px;
    padding:9px 15px; font-weight:600; }
  .btn:hover{ background:#242424; }
  .btn:disabled{ opacity:.45; cursor:default; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ background:#e63229; }
  .btn.ghost{ background:transparent; border-color:transparent; color:var(--dim); }
  .btn.ghost:hover{ color:var(--txt); background:var(--panel2); }
  .btn.sm{ padding:6px 11px; font-size:13px; }
  a.link{ color:#7fb2ff; text-decoration:none; }
  a.link:hover{ text-decoration:underline; }

  main{ flex:1; display:flex; min-height:0; }

  /* ---------- lista ---------- */
  #side{ width:330px; flex:none; border-right:1px solid var(--line); display:flex; flex-direction:column;
    background:var(--panel); min-height:0; }
  #side .tools{ padding:12px; display:flex; gap:8px; border-bottom:1px solid var(--line); }
  #search{ flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:9px; color:var(--txt);
    padding:9px 11px; font-size:14px; min-width:0; }
  #list{ flex:1; overflow-y:auto; padding:8px; }
  .item{ background:var(--panel2); border:1px solid transparent; border-radius:11px; padding:11px 12px;
    margin-bottom:7px; cursor:pointer; position:relative; }
  .item:hover{ border-color:#333; }
  .item.sel{ border-color:var(--accent); background:#241618; }
  .item.drag{ opacity:.35; }
  .item.over{ border-color:#7fb2ff; }
  .item .nm{ font-weight:600; font-size:14.5px; margin-bottom:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .pv{ font-size:12.5px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .mt{ font-size:11.5px; color:#6a6a6a; margin-top:5px; font-variant-numeric:tabular-nums; }
  .item .mv{ position:absolute; right:7px; top:7px; display:none; gap:3px; }
  .item:hover .mv, .item.sel .mv{ display:flex; }
  .mv button{ background:#2c2c2c; border:none; color:#bbb; width:24px; height:22px; border-radius:6px; font-size:11px; line-height:1; }
  .mv button:hover{ background:#3a3a3a; color:#fff; }
  #side .foot{ padding:10px 12px calc(10px + var(--safe-b)); border-top:1px solid var(--line);
    display:flex; gap:8px; flex-wrap:wrap; }
  .empty{ color:var(--dim); font-size:13.5px; text-align:center; padding:30px 16px; line-height:1.6; }

  /* ---------- edytor ---------- */
  #ed{ flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }
  #ed .top{ padding:14px 18px 10px; display:flex; gap:10px; align-items:center; }
  #name{ flex:1; background:transparent; border:none; border-bottom:1px solid var(--line); color:var(--txt);
    font-size:20px; font-weight:700; padding:8px 2px; min-width:0; }
  #name:focus{ outline:none; border-bottom-color:var(--accent); }
  #body{ flex:1; margin:6px 18px 0; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    color:var(--txt); padding:16px 18px; font-size:17px; line-height:1.65; resize:none; min-height:0; }
  #body:focus{ outline:none; border-color:#3a3a3a; }
  #ed .foot{ display:flex; align-items:center; gap:14px; padding:11px 18px calc(14px + var(--safe-b));
    color:var(--dim); font-size:12.5px; flex-wrap:wrap; }
  #ed .foot .sp{ flex:1; }
  #stats b{ color:#c9c9c9; font-weight:600; font-variant-numeric:tabular-nums; }
  #noSel{ flex:1; display:flex; align-items:center; justify-content:center; color:var(--dim);
    text-align:center; padding:40px; line-height:1.7; }

  /* ---------- modal ---------- */
  #ov{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center;
    z-index:50; padding:20px; }
  #ov.show{ display:flex; }
  .modal{ background:#161616; border:1px solid var(--line); border-radius:16px; width:min(560px,100%);
    max-height:86dvh; overflow-y:auto; padding:22px 24px 24px; }
  .modal h3{ margin:0 0 6px; font-size:18px; }
  .modal p{ color:var(--dim); font-size:13.5px; line-height:1.6; margin:8px 0; }
  .modal ol{ color:var(--dim); font-size:13.5px; line-height:1.75; padding-left:20px; margin:10px 0; }
  .modal input[type=text],.modal input[type=password]{ width:100%; background:var(--panel2); border:1px solid var(--line);
    border-radius:10px; color:var(--txt); padding:12px; font-size:14px; margin:8px 0; }
  .modal .row{ display:flex; gap:9px; margin-top:14px; flex-wrap:wrap; }
  .code{ background:#0b0b0b; border:1px solid var(--line); border-radius:10px; padding:12px; font-size:12px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; word-break:break-all; color:#9fd0a0; max-height:110px; overflow:auto; }
  .warn{ background:#2a1b12; border:1px solid #4a2f1c; color:#e0b48b; border-radius:10px; padding:11px 13px;
    font-size:12.5px; line-height:1.55; margin-top:12px; }

  /* ---------- toast ---------- */
  #toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:#000; border:1px solid var(--line);
    padding:11px 18px; border-radius:22px; font-size:13.5px; opacity:0; transition:opacity .25s; pointer-events:none;
    z-index:60; max-width:90vw; text-align:center; }
  #toast.show{ opacity:1; }
  #toast.bad{ border-color:var(--accent); color:#ffb4b0; }

  /* ---------- telefon ---------- */
  @media (max-width:820px){
    main{ flex-direction:column; }
    #side{ width:100%; border-right:none; border-bottom:1px solid var(--line); max-height:44dvh; }
    #ed{ min-height:56dvh; }
    #body{ font-size:16px; }
    header{ padding:10px 12px; gap:8px; }
    header .logo{ font-size:14px; }
    body.editing #side{ display:none; }
    body.editing #ed{ min-height:0; flex:1; }
    #backList{ display:inline-flex; }
  }
  #backList{ display:none; }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div class="logo">PROMPT<span>ER</span> · skrypty</div>
    <div class="sp"></div>
    <div class="chip" id="cloudChip"><span class="dot"></span><span id="cloudTxt">Tylko lokalnie</span></div>
    <button class="btn sm" id="btnSync">Synchronizuj</button>
    <button class="btn sm" id="btnCloud">Chmura</button>
    <a class="btn sm" id="btnOpen" href="./" target="_blank" style="text-decoration:none;">Prompter ↗</a>
  </header>

  <main>
    <section id="side">
      <div class="tools">
        <input id="search" type="text" placeholder="Szukaj...">
        <button class="btn sm primary" id="btnNew">＋ Nowy</button>
      </div>
      <div id="list"></div>
      <div class="foot">
        <button class="btn sm" id="btnImport">Wgraj pliki</button>
        <button class="btn sm" id="btnExport">Eksport JSON</button>
        <input type="file" id="fileIn" multiple accept=".txt,.md,.json,.rtf,text/plain" hidden>
      </div>
    </section>

    <section id="ed">
      <div id="noSel">Wybierz skrypt z listy albo dodaj nowy.<br>Możesz też przeciągnąć tu pliki .txt / .md.</div>
      <div class="top" style="display:none;">
        <button class="btn sm ghost" id="backList">‹ Lista</button>
        <input id="name" type="text" placeholder="Nazwa skryptu">
      </div>
      <textarea id="body" placeholder="Wklej albo napisz tekst do przeczytania..." style="display:none;" spellcheck="true"></textarea>
      <div class="foot" style="display:none;" id="edFoot">
        <span id="stats"></span>
        <span class="sp"></span>
        <span id="saveState">Zapisano</span>
        <button class="btn sm" id="btnDup">Duplikuj</button>
        <button class="btn sm" id="btnDel">Usuń</button>
      </div>
    </section>
  </main>
</div>

<div id="ov">
  <div class="modal" id="modal"></div>
</div>

<div id="toast"></div>

<script src="./store.js"></script>
<script src="./dashboard.js"></script>
</body>
</html>
